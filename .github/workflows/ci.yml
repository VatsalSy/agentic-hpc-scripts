name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh minimal/submit-and-poll.sh tests/run.sh tests/stubs/* example/job.sbatch
      - name: offline tests
        run: bash tests/run.sh
